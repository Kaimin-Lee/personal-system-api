name: 🚀 部署后端 (LifeOS API)

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 拉取最新代码
        uses: actions/checkout@v3

      - name: ☕ 配置 Java 17 环境
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📦 Maven 打包编译
        run: mvn clean package -DskipTests

      - name: 📤 上传 Jar 包到阿里云
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # 【终极修复 1】：不管名字和版本号叫什么，把 target 下所有的 jar 包全部抓走
          source: "target/*.jar"
          target: "/personal-system/personal-system-api-temp/"
          strip_components: 1

      - name: 🔄 重启后端服务
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            mkdir -p /personal-system/personal-system-api
            cd /personal-system/personal-system-api
            
            # 1. 备份旧包 (不管原来叫什么，现在统称为 personal-system-api.jar)
            mv personal-system-api.jar personal-system-api.bak || true
            
            # 2. 清理上传过来的临时文件中没用的 .original 原生小包
            rm -f /personal-system/personal-system-api-temp/*.original
            
            # 3. 【终极修复 2】：把剩下的唯一那个真正的 Spring Boot 运行包重命名为 personal-system-api 移过来
            mv /personal-system/personal-system-api-temp/*.jar ./personal-system-api.jar
            
            # 4. 杀掉占用 40910 端口的旧进程
            PID=$(lsof -t -i:40910)
            if [ -n "$PID" ]; then
              echo "Killing old process: $PID"
              kill -9 $PID
            fi
            
            # 5. 启动新进程
            nohup java -jar personal-system-api.jar > log.txt 2>&1 &
            echo "✅ 后端服务已成功部署到 /personal-system/personal-system-api！"